name: reviewer

# The reviewer agent as a CI job (ADR-0016): the review runs on every
# pull request push, and its exit code becomes a REQUIRED status check,
# so "zero BLOCKING findings" is machine-checkable before any merge.
#
# The job also re-runs when the `human-approved` label is posed or
# removed (ADR-0020), so the waiver always reflects the current label
# state. The gh CLI is never used - it is not preinstalled on
# GitHub-hosted runners - so every GitHub interaction goes through the
# REST API directly.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # Manual trigger: the reviewer consumes LLM API tokens on every push, so
  # automatic runs are gated behind the REVIEWER_ENABLED repo variable.
  # Run it by hand from the Actions tab when a review is actually needed.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: reviewer-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  reviewer:
    name: reviewer agent
    # Label events re-run the review only when the touched label is the
    # human-approved waiver (ADR-0020); no other label can change the
    # verdict. Automatic PR runs are disabled unless REVIEWER_ENABLED=true;
    # workflow_dispatch always runs.
    if: (github.event_name == 'workflow_dispatch' || vars.REVIEWER_ENABLED == 'true') && (github.event.action != 'labeled' && github.event.action != 'unlabeled' || github.event.label.name == 'human-approved')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --locked

      - name: Export the pull request description
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p .review
          # The PR description via the GitHub REST API, not the gh CLI.
          curl --silent \
            --header "Authorization: token ${{ github.token }}" \
            --header "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
            | jq --raw-output '.body // ""' > .review/pull-request-description.md

      - name: Export the pull request labels
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Labels of the PR via the GitHub REST API. A manually posed
          # `human-approved` label waives every BLOCKING finding
          # (ADR-0020); the labels are read by the runner script only,
          # they never enter the reviewer's prompt.
          curl --silent \
            --header "Authorization: token ${{ github.token }}" \
            --header "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/labels" \
            | jq '[.[].name]' > .review/pull-request-labels.json

      - name: Build the review bundle
        run: |
          git diff --no-color "origin/${{ github.base_ref }}...HEAD" > .review/pull-request.diff
          uv run python scripts/build_review_bundle.py \
            --diff-file .review/pull-request.diff \
            --description-file .review/pull-request-description.md \
            --output .review/bundle.md

      - name: Run the reviewer agent
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          REVIEWER_MODEL: ${{ vars.REVIEWER_MODEL }}
        run: |
          uv run python scripts/agent_review.py \
            --bundle-file .review/bundle.md \
            --report-file .review/review-report.json \
            --comment-file .review/review-comment.md \
            --labels-file .review/pull-request-labels.json

      - name: Publish the review comment
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -f .review/review-comment.md ]; then
            # Post the comment via the GitHub REST API, not the gh CLI.
            # jq -Rs escapes the whole file into one JSON string.
            COMMENT_BODY_JSON=$(jq --raw-input --slurp . .review/review-comment.md)
            curl --silent --fail \
              --request POST \
              --header "Authorization: token $GITHUB_TOKEN" \
              --header "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
              --data "{\"body\": ${COMMENT_BODY_JSON}"
          else
            echo "No review comment was produced (protocol failure?)."
          fi

      - name: Archive the review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report
          path: .review/review-report.json
          if-no-files-found: warn
