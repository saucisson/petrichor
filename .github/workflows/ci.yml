name: continuous-integration

on:
  push:
    branches: [main, daily]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and pin Python 3.15
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: mypy strict
        run: uv run mypy tools/notify/src tools/notify/tests scripts

      - name: import-linter onion contract
        run: uv run lint-imports

      - name: pytest with coverage floor (@ui browser e2e runs in its own job below)
        run: uv run pytest -m "not ui"

      - name: Setup Node (pinned by .node-version, ADR-0101)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/petrichor/api/ui/package-lock.json

      - name: Frontend gates of the UI v2 (ESLint, tsc --noEmit, vitest)
        run: make ui-gates

  ui-e2e:
    # Voie UI observée en CI (friction F5, issue #128): real Chromium against
    # the real API on the real compose engines, behind the @ui marker. Images
    # pre-built by the test itself outside any watchdog (P39 lesson), adapted
    # timeouts: a slow run is a slow verdict, never a watchdog error.
    name: ui e2e browser
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv and pin Python 3.15
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15"
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --locked

      - name: Setup Node (pinned by .node-version, ADR-0101)
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: src/petrichor/api/ui/package-lock.json

      - name: Install the UI dependencies and the Chromium browser
        run: make ui-e2e-deps

      - name: UI e2e parcours (@ui marker, real compose engines)
        run: uv run pytest -m ui tests/test_ui_e2e.py --no-cov

  security:
    name: security gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action to read pull request history.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: pip-audit of the locked graph
        run: |
          uv export --locked --no-emit-project --format requirements-txt \
            --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --strict
