# petrichor.linard.fr — reverse proxy vers le service compose `api`
# (publié en loopback sur 127.0.0.1:8080, ADR-0102/0103). Même pattern que
# /etc/nginx/sites-enabled/layered-data : un site par domaine, TLS géré par
# Certbot (`certbot --nginx -d petrichor.linard.fr` complète ce fichier).
# Installation : copier dans /etc/nginx/sites-enabled/petrichor puis
# `sudo nginx -t && sudo systemctl reload nginx`.
server {
    server_name petrichor.linard.fr;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
    }

    listen 80;
    listen [::]:80;
}
