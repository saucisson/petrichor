# OpenAPI contract of the Petrichor HTTP API (ADR-0016) - kept with the code.
# Versioning is explicit in the URL prefix (/v1). Errors are RFC 7807
# problem+json everywhere. Web v1 (issue #206, contract
# docs/consigne-interface-web-v1.md §1/§5): GET /catalog/models and
# GET /models/{model_id} are public read-only routes (security: []) of the
# Découvrir zone; every other /v1 route requires a session cookie or a Bearer
# PAT and answers 401 reason "session_required" without one.
openapi: 3.1.0
info:
  title: Petrichor API
  version: 1.0.0
  description: >-
    Gérer service: PNML import into the canonical petri+json v1.0 form and
    model read (spec §4.1, §5, §13), plus asynchronous checks: POST
    /checks/{family} answers 202 + Location and is idempotent by hash of
    (model, question); GET /runs/{run_id} polls running | done | error
    (spec §5, §12.1). Symmetric nets are stored non-unfolded.
servers:
  - url: /v1
security:
  - apiKey: []
paths:
  /:
    get:
      summary: Redirect to the elicitation UI (spec §9, issue #18)
      description: >-
        302 to /ui/. The UI assets are public (they carry no data); every data
        call they make goes through the authenticated /v1 API.
      security: []
      responses:
        "302":
          description: Redirect to /ui/.
          headers:
            Location:
              schema:
                type: string
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /ui/{asset}:
    get:
      summary: Static assets of the elicitation UI (spec §9, issue #18)
      description: >-
        Whitelist of index.html, app.js, styles.css - unauthenticated, since
        the assets contain no data. Any other name (including traversal
        attempts) is a 404; non-GET methods are a 405.
      security: []
      parameters:
        - name: asset
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The asset, with its content type (text/html, text/javascript, text/css).
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /models:
    post:
      summary: Import a PNML document or an archive into the canonical form
      description: >-
        201 when the content hash is new, 200 when the same net was already
        imported (idempotent by content hash, spec §13). Invalid or
        unsupported PNML is rejected with 422 - never silently unfolded.
        Archives (application/zip, application/gzip, application/x-tar) are
        accepted under the upload quota with protected extraction (spec
        §21.3): one PNML imports directly, several PNML answer 409 with the
        typed candidate list and import only on an explicit candidate query
        parameter - never a silent multi-import.
      parameters:
        - name: candidate
          in: query
          schema:
            type: string
          description: The archive member to import when the source holds several PNML documents.
      requestBody:
        required: true
        content:
          application/pnml+xml:
            schema:
              type: string
              format: xml
          application/zip:
            schema:
              type: string
              format: binary
          application/gzip:
            schema:
              type: string
              format: binary
          application/x-tar:
            schema:
              type: string
              format: binary
      responses:
        "409":
          description: >-
            The source contains several PNML documents; the typed body lists
            the candidates (name, size, sha256, detected formalism).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateList"
        "413":
          description: The upload exceeds the quota (reason quota_exceeded).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "201":
          description: Model created; Location header points at the resource.
          headers:
            Location:
              schema:
                type: string
              description: /v1/models/{model_id}
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "200":
          description: The content hash was already known; the existing model is returned.
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: >-
            Invalid or unsupported PNML (InvalidPnml), unsafe archive
            (reason unsafe_archive, refused members listed), no PNML in the
            archive (no_pnml), corrupt archive (invalid_archive).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /models/import-url:
    post:
      summary: Import a PNML or an archive from an allowlisted https URL (spec §21.3, ADR-0008)
      description: >-
        The URL must be https and its domain must be in the versioned
        allowlist (url_import.json); every resolved address must be public
        (SSRF rejection, ADR-0008) and redirects are re-validated. The
        download honors a timeout and a size quota, then the same
        one-PNML-or-candidates rule as POST /v1/models applies. Provenance
        (source url, sha256) is recorded in the model metadata.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelImportUrlRequest"
      responses:
        "201":
          description: Model created; Location header points at /v1/models/{model_id}.
          headers:
            Location:
              schema:
                type: string
              description: /v1/models/{model_id}
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "200":
          description: The same net was already imported (idempotent by content hash).
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown candidate name (reason unknown_candidate).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Several PNML documents in the downloaded source (reason multiple_candidates).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CandidateList"
        "413":
          description: The download exceeds the quota (reason quota_exceeded).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: >-
            URL not allowlisted or not https (url_not_allowed), private/local
            network refused (private_network_rejected), invalid body
            (invalid_body), invalid PNML (invalid_pnml), unsafe or empty
            archive (unsafe_archive / no_pnml / invalid_archive).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "502":
          description: The download failed (reason download_failed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: URL import is not configured on this server (reason url_import_not_configured).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /models/{model_id}:
    get:
      summary: Read a model in its canonical form (public, read-only — issue #206)
      description: >-
        Public route of the Découvrir zone (contract §1/§5): no session, no
        PAT required. Serves the canonical petri+json document.
      security: []
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The canonical petri+json document, content hash included.
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          description: >-
            The Accept header admits no supported representation. PNML
            re-export is not supported yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /catalog/models:
    get:
      summary: Search the MCC model catalog (spec §21.2, ADR-0105) — public, read-only (issue #206)
      description: >-
        Public route of the Découvrir zone (contract §1/§5): no session, no
        PAT required.
        Paginated listing of the known MCC instances with free-text search on
        name/family, facet filters (family, formalism, edition, source, size),
        a closed sort set (name, family, edition, size - size is semantic,
        small to huge) and limit/offset pagination. 503 catalog_unavailable
        when every configured source failed to refresh.
      security: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
          description: Free-text search on name and family.
        - name: family
          in: query
          schema:
            type: string
        - name: formalism
          in: query
          schema:
            type: string
            enum: [PT, COL]
        - name: edition
          in: query
          schema:
            type: string
        - name: source
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: string
            enum: [small, medium, large, huge]
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, family, edition, size]
            default: name
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: One page of catalog entries with facet counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "400":
          description: Invalid sort or pagination parameter (reason invalid_sort / invalid_pagination).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Every catalog source failed (reason catalog_unavailable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /catalog/import:
    post:
      summary: Import one catalog instance by name into the canonical form (spec §21.2)
      description: >-
        Fetches the PNML of the named instance from its source (with a bounded
        disk cache and a download quota), imports it into the canonical
        petri+json form and records the provenance (catalog, source, edition,
        name, url, sha256) in the model metadata. 201 when the content hash is
        new, 200 when the same net was already imported (idempotent by content
        hash, like POST /v1/models).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogImportRequest"
      responses:
        "201":
          description: Model created; Location header points at /v1/models/{model_id}.
          headers:
            Location:
              schema:
                type: string
              description: /v1/models/{model_id}
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "200":
          description: The same net was already imported (idempotent by content hash).
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown catalog instance name (reason unknown_model).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          description: The archive exceeds the configured download quota (reason quota_exceeded).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: Invalid body (reason invalid_body) or invalid PNML (reason invalid_pnml).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: Catalog or source unavailable (reason catalog_unavailable / source_unavailable).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /checks/{family}:
    post:
      summary: Accept a check question asynchronously (one endpoint per family)
      description: >-
        Answers 202 Accepted with Location: /v1/runs/{run_id}; the run is
        executed in the background and polled on GET /v1/runs/{run_id}
        (spec §5). Idempotent: the same (model, question) hash returns the
        existing run without re-executing it. The kind pattern must belong
        to the family of the endpoint - a pattern outside the family is
        422 and is never reinterpreted (garde anti-polymorphisme, spec
        §12.1). Engine errors and timeouts surface as the explicit error
        state of the run, never as a default verdict. Every new run passes
        the session budget cap (spec §12.4): when the remaining budget
        cannot cover the run, the request is refused with 429 and the
        remaining budget in the problem extensions - no carry-over.
        Each question is triaged first (spec §14.2, issue #14): a statically
        triaged question is resolved by the embedded engine without any MC
        run (cost zero, output technique "static"); when the static proof
        cannot be found the question is explicitly degraded and the run
        carries the degradation in its triage field. The run also carries
        the non-vacuity guard chip of the question (spec §14.4).
      parameters:
        - name: family
          in: path
          required: true
          schema:
            type: string
            enum: [reachability, safety, liveness, recovery, deadlock, structural]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "202":
          description: Check accepted; Location header points at the run resource.
          headers:
            Location:
              schema:
                type: string
              description: /v1/runs/{run_id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: The Content-Length header is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown check family or unknown model.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Malformed body, or kind pattern outside the family (never reinterpreted).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            Session budget cap exceeded (spec §12.4): the remaining budget
            cannot cover one run. The problem extensions carry
            remaining_budget_seconds, session_budget_seconds,
            consumed_seconds, reserved_seconds and timeout_seconds.
            No carry-over.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No check runner wired into this server yet (real engines: P09+).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{run_id}:
    get:
      summary: Poll one asynchronous run
      description: >-
        The run states are running, done (with the normalized engine output
        served verbatim) and error (explicit kind: engine_error or timeout -
        never a default verdict).
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The current state of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /runs/{run_id}/witness:
    get:
      summary: The §16 witness document of one run, with per-step LLM narrations (issue #32)
      description: >-
        Structure = tool (markings, fired transitions, cyclicity, back-edge),
        normalized from any engine's output into the §16 format. Narrations
        are LLM propositions labeled `provenance: llm`, never verdicts
        (spec §16, §19.4). 404 `witness_not_found` when the run carries no
        witness.
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The §16 witness document of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WitnessDocument"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /witnesses/{witness_id}:
    get:
      summary: One stored witness with the runs referencing it (stored once, referenced n times)
      description: >-
        Witnesses are deduplicated by content hash: a witness shared by
        several violations is stored once and referenced by each run
        (spec §16, issue #32).
      parameters:
        - name: witness_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The stored witness record and its referencing runs.
          content:
            application/json:
              schema:
                type: object
                required: [record, referenced_by]
                properties:
                  record:
                    $ref: "#/components/schemas/WitnessRecord"
                  referenced_by:
                    type: array
                    items:
                      type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /llm/usage:
    get:
      summary: The accumulated LLM cost, displayed apart from the tool-time budget (issue #36)
      description: >-
        The MC budget counts only tool seconds (spec §12.4); the LLM cost
        (calls, tokens) is exposed here, separately, never mixed into it.
      responses:
        "200":
          description: The LLM usage totals of the configured provider.
          content:
            application/json:
              schema:
                type: object
                required: [llm, budget_note]
                properties:
                  llm:
                    type: object
                    properties:
                      provider:
                        type: string
                      routing:
                        type: object
                        description: >-
                          The exact pinned version per usage (P74, ADR-0108);
                          present only when the provider routes per usage.
                        additionalProperties:
                          type: string
                      calls:
                        type: integer
                      by_usage_model:
                        type: object
                        description: The LLM cost per (usage, model) couple (P72/P74).
                        additionalProperties:
                          type: object
                          properties:
                            calls:
                              type: integer
                            total_tokens:
                              type: integer
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
                      total_tokens:
                        type: integer
                  budget_note:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No LLM provider is wired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /llm/calls:
    get:
      summary: The observable state of every LLM call (P75)
      description: >-
        Polled by the UI while a real LLM call may be in flight, to show the
        active waiting indicator (animated hourglass, usage, elapsed) — never
        a frozen screen without information. The deterministic mock is
        instantaneous: no call is ever in progress with it. Only the most
        recent call states are kept (bounded history), so the payload stays
        small on a long-lived server.
      responses:
        "200":
          description: The call states of the configured provider.
          content:
            application/json:
              schema:
                type: object
                required: [calls]
                properties:
                  calls:
                    type: array
                    items:
                      type: object
                      required: [usage, model, started_at, ended_at, error, in_progress]
                      properties:
                        usage:
                          type: string
                          enum: [semantic-profile, reading, clarification, cluster, narration]
                        model:
                          type: string
                        started_at:
                          type: string
                          format: date-time
                        ended_at:
                          type: string
                          format: date-time
                          nullable: true
                        error:
                          type: string
                          nullable: true
                        in_progress:
                          type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: No LLM provider is wired.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /qualification:
    get:
      summary: Qualification status per adapter and family
      description: >-
        The stored qualification status of every adapter for every check
        family (spec §17.5, issue #22), exposed to the orchestrator. An
        adapter absent from the snapshot is unqualified for every family:
        qualification is earned by replaying the MCC benchmark oracles, never
        assumed.
      responses:
        "200":
          description: The qualification snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [engines]
                properties:
                  engines:
                    type: object
                    additionalProperties:
                      type: object
                      additionalProperties:
                        type: string
                        enum: [qualified, unqualified]
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          description: No qualification lookup wired into this server yet (issue #22).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /sessions:
    post:
      summary: Create a resumable session for a model
      description: >-
        Creates a persistent session bound to a model (spec §4 Gérer).
        The full state is serialized server-side; the session survives a
        process restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id:
                  type: string
                budget_seconds:
                  type: number
                  description: Optional per-session MC budget cap in tool seconds (spec §12.4, issue #33); defaults to the server setting.
      responses:
        "201":
          description: Session created; Location header points at the resource.
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "400":
          description: The Content-Length header is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          description: The body is not valid JSON or lacks a model_id string field.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: List sessions with limit/offset pagination, in creation order
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: A page of sessions in creation order, with total count.
          content:
            application/json:
              schema:
                type: object
                required: [sessions, total, limit, offset]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          description: A pagination parameter (limit/offset) is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}:
    get:
      summary: Read one session with its full serialized state
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}/budget:
    get:
      summary: The live MC budget of one session (spec §12.4, issue #33)
      description: >-
        The budget lives continuously per session: `budget_seconds` is the
        session's own cap (set at creation), `consumed_seconds` the measured
        tool time of its terminal runs, `reserved_seconds` its in-flight
        reservations, `remaining_seconds` what its next run may still claim.
        No carry-over to another session, ever.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The live budget of the session.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, budget_seconds, consumed_seconds, reserved_seconds, remaining_seconds, run_count]
                properties:
                  session_id:
                    type: string
                  budget_seconds:
                    type: number
                  consumed_seconds:
                    type: number
                  reserved_seconds:
                    type: number
                  remaining_seconds:
                    type: number
                  run_count:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}/journal:
    get:
      summary: Export the append-only timestamped journal of a session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The journal entries, in append order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}/arbitration-requests:
    post:
      summary: Arbitrate one question card (accept / refuse / verify-first)
      description: >-
        Records one human decision on a generated question card (spec §4.8,
        §12.7). A repeated question is a REVISION: a new decision is recorded
        and the previous one stays in the history and the journal
        (avant/après). Revising the arbitration of a question also reopens
        the clauses of the questions covered by convergence with it
        (spec §12.7): the reopening is appended to the journal as a
        `convergence_reopened` entry, and the journal keeps the old and the
        new decision alike. No automatic fusion of questions ever happens
        here - convergence is a separate human-only decision
        (`POST /convergences`). Every decision is appended to the session
        journal as an `arbitration_decided` entry.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, decision]
              additionalProperties: false
              properties:
                question_id:
                  type: string
                decision:
                  enum: [accept, refuse, verify-first]
      responses:
        "201":
          description: The recorded decision plus the question's decision history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    $ref: "#/components/schemas/ArbitrationRecord"
                  question_history:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArbitrationRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /sessions/{session_id}/arbitrations:
    get:
      summary: The full append-only arbitration history of a session
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Every decision of the session, in append order.
          content:
            application/json:
              schema:
                type: object
                properties:
                  decisions:
                    type: array
                    items:
                      $ref: "#/components/schemas/ArbitrationRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{session_id}/convergences:
    post:
      summary: Fuse one question into a converging surviving one (human-only, spec §12.2)
      description: >-
        Records one human fusion of two converging generated questions
        (spec §4.8, §12.2, §14.5): the `question_id` is marked `covered` in
        the contract and never solicited again. Only Arbitrer merges - the
        two questions must be generated for the session and must converge
        (same family.kind, same targets up to symmetry indices or identical
        normalized formula), otherwise `422` convergence_rejected. Automatic
        fusion is forbidden. The fusion is appended to the session journal as
        a `convergence_fused` entry.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question_id, proposition_id]
              additionalProperties: false
              properties:
                question_id:
                  type: string
                proposition_id:
                  type: string
      responses:
        "200":
          description: The identical fusion already existed - idempotent repeat, nothing appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    $ref: "#/components/schemas/ConvergenceRecord"
        "201":
          description: The recorded fusion.
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    $ref: "#/components/schemas/ConvergenceRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
    get:
      summary: List the fusions of a session with limit/offset pagination, in append order (ADR-0016)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 500
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        "200":
          description: A page of fusions in append order, with the total count.
          content:
            application/json:
              schema:
                type: object
                required: [convergences, total, limit, offset]
                properties:
                  convergences:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConvergenceRecord"
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        "400":
          description: A pagination parameter (limit/offset) is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /sessions/{session_id}/questions/{question_id}/formula:
    post:
      summary: Edit the formula of one question card (spec §9 maquette P7, issue #37)
      description: >-
        Records one append-only formula edit: the old and new formulas both
        stay in the journal (the witness of the old formula is never lost),
        and the response carries the inverse reading of the new formula
        (formule → langage, an LLM proposition labeled `provenance: llm`,
        degraded explicitly when unavailable). The edited formula is
        re-verified through the standard check chain (POST /checks/{family}).
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: question_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [formula]
              additionalProperties: false
              properties:
                formula:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: The recorded edit plus the inverse reading of the new formula.
          content:
            application/json:
              schema:
                type: object
                properties:
                  record:
                    type: object
                    required: [session_id, question_id, old_formula, new_formula, timestamp]
                    properties:
                      session_id:
                        type: string
                      question_id:
                        type: string
                      old_formula:
                        type: string
                      new_formula:
                        type: string
                      timestamp:
                        type: number
                  reading:
                    type: object
                    nullable: true
                    description: The inverse reading (provenance llm), or a degradation note.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /sessions/{session_id}/reading:
    get:
      summary: The inverse reading of any formula (formule → langage, spec §9, issue #37)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: formula
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The reading of the formula, an LLM proposition labeled provenance llm.
          content:
            application/json:
              schema:
                type: object
                required: [formula, reading]
                properties:
                  formula:
                    type: string
                  reading:
                    type: object
                    nullable: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Unprocessable"
  /sessions/{session_id}/contract:
    get:
      summary: The contract of a session, negotiated as contract+json or Markdown (spec §4.8)
      description: >-
        The exportable deliverable aggregated from the session state: arbitrated
        profile, proposed hypotheses, questions by family with their status and
        proof links, and the append-only journal. Replayable: building it twice
        from the same state yields identical output.
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: Accept
          in: header
          required: false
          schema:
            type: string
          description: >-
            text/markdown for the Markdown export, application/contract+json
            (default) for the structured document.
      responses:
        "200":
          description: The contract document in the negotiated representation.
          content:
            application/contract+json; version=1.0:
              schema:
                $ref: "#/components/schemas/ContractDocument"
            text/markdown:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          description: The Accept header admits neither representation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /sessions/{session_id}/profile:
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile state (proposed entries, arbitrations, coverage groups).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileState"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}/profile/arbitrate:
    post:
      summary: Arbitrate one proposed role — accept or replace it (spec §14)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArbitrationDecision"
      responses:
        "200":
          description: The updated profile state after arbitration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileState"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /sessions/{session_id}/coverage:
    get:
      summary: Coverage groups of a session; uncovered ones are re-seeding targets (spec §14)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The coverage groups and the uncovered re-seeding targets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoverageReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /sessions/{session_id}/state-graph:
    get:
      summary: Reachability graph of the session's permanent model, always consultable (P13)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            The state graph (states, edges, deadlocks). `truncated: true` marks the
            explicit degradation when the graph exceeds the engine capacity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StateGraphReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /sessions/{session_id}/annotations:
    put:
      summary: Set one in-situ annotation on one element; persisted outside the content hash (P13)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnnotationRequest"
      responses:
        "200":
          description: The element's annotations after the update; the content hash is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnotationReport"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
  /sessions/{session_id}/net-overlay:
    get:
      summary: Coverage overlay of the permanent net — card to elements + greyed coverage (P13)
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: >-
            Per-element coverage state and per-group resolved element ids; `greyed`
            lists the uncovered element ids the front renders greyed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetOverlay"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    PnmlCandidate:
      type: object
      required: [name, size_bytes, sha256, content, formalism]
      properties:
        name:
          type: string
          description: The archive member path of the PNML document.
        size_bytes:
          type: integer
        sha256:
          type: string
        content:
          type: string
        formalism:
          type: string
          enum: [pt, symmetric]
    CandidateList:
      type: object
      required: [reason, detail, candidates]
      properties:
        reason:
          type: string
          enum: [multiple_candidates]
        detail:
          type: string
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/PnmlCandidate"
    ModelImportUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: An https URL whose domain is in the versioned allowlist.
        candidate:
          type: string
          nullable: true
          description: The archive member to import when the source holds several PNML documents.
    CatalogEntry:
      type: object
      required: [name, family, source, url]
      properties:
        name:
          type: string
          description: The instance name, e.g. Philosophers-PT-010.
        family:
          type: string
          description: The model family, e.g. Philosophers.
        formalism:
          type: string
          enum: [PT, COL]
          nullable: true
        edition:
          type: string
          nullable: true
          description: The MCC edition year when the source provides it.
        source:
          type: string
          description: The configured source id that listed this entry.
        size_bucket:
          type: string
          enum: [small, medium, large, huge]
          nullable: true
          description: Compressed-size bucket of the archive, when known.
        url:
          type: string
          description: The URL the PNML archive is fetched from.
        sha256:
          type: string
          nullable: true
    CatalogFacets:
      type: object
      properties:
        family:
          type: object
          additionalProperties:
            type: integer
        formalism:
          type: object
          additionalProperties:
            type: integer
        edition:
          type: object
          additionalProperties:
            type: integer
        source:
          type: object
          additionalProperties:
            type: integer
        size:
          type: object
          additionalProperties:
            type: integer
    CatalogPage:
      type: object
      required: [items, total, limit, offset, facets]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogEntry"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        facets:
          $ref: "#/components/schemas/CatalogFacets"
    CatalogImportRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: The catalog instance name to import, as listed by GET /v1/catalog/models.
    Session:
      type: object
      required: [session_id, model_id, created_at, updated_at, run_ids, budget_seconds]
      properties:
        session_id:
          type: string
        model_id:
          type: string
        created_at:
          type: number
        updated_at:
          type: number
        run_ids:
          type: array
          items:
            type: string
        budget_seconds:
          type: number
          description: The session's own MC budget cap in tool seconds (spec §12.4, issue #33); never carried over.
    JournalEntry:
      type: object
      required: [timestamp, event, detail]
      properties:
        timestamp:
          type: number
        event:
          type: string
        detail:
          type: object
    ArbitrationRecord:
      type: object
      required: [session_id, question_id, decision, timestamp, previous_decision]
      properties:
        session_id:
          type: string
        question_id:
          type: string
        decision:
          enum: [accept, refuse, verify-first]
        timestamp:
          type: number
        previous_decision:
          enum: [accept, refuse, verify-first]
          nullable: true
    ConvergenceRecord:
      type: object
      required: [session_id, question_id, proposition_id, timestamp]
      properties:
        session_id:
          type: string
        question_id:
          type: string
          description: The covered question - never solicited again once fused.
        proposition_id:
          type: string
          description: The surviving question the covered one converges with.
        timestamp:
          type: number
    WitnessStep:
      type: object
      required: [index, marking, fired]
      properties:
        index:
          type: integer
          minimum: 0
        marking:
          type: array
          items:
            type: string
        fired:
          type: string
          nullable: true
    Narration:
      type: object
      required: [step_index, text, provenance]
      properties:
        step_index:
          type: integer
          minimum: 0
        text:
          type: string
        provenance:
          enum: [llm]
          description: A narration is always an LLM proposition, never a verdict (spec §16, §19.4).
    WitnessRecord:
      type: object
      required: [witness_id, kind, cyclic, back_edge, steps]
      properties:
        witness_id:
          type: string
        kind:
          enum: [counterexample, trace]
        cyclic:
          type: boolean
        back_edge:
          type: integer
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WitnessStep"
    WitnessDocument:
      type: object
      required: [run_id, witness_id, kind, cyclic, back_edge, steps, narrations]
      properties:
        run_id:
          type: string
        witness_id:
          type: string
        kind:
          enum: [counterexample, trace]
        cyclic:
          type: boolean
        back_edge:
          type: integer
          nullable: true
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WitnessStep"
        narrations:
          type: array
          items:
            $ref: "#/components/schemas/Narration"
    ContractDocument:
      type: object
      required: [version, session_id, model_id, profile, questions, budget, proof_dossiers, journal]
      properties:
        version:
          type: string
          enum: ["1.0"]
        session_id:
          type: string
        model_id:
          type: string
        profile:
          type: array
          items:
            type: object
            required: [entry_id, elements, proposed_role, confidence, evidence, accepted, chosen_role]
            properties:
              entry_id:
                type: string
              elements:
                type: string
              proposed_role:
                type: string
              confidence:
                type: number
              evidence:
                type: string
              accepted:
                type: boolean
              chosen_role:
                type: string
                nullable: true
        questions:
          type: array
          items:
            type: object
            required: [question_id, template_id, family, kind, formula, triage, risk, cost, scenario, role, status, proofs, examination, cross_status, verified_by]
            properties:
              question_id:
                type: string
              template_id:
                type: string
              family:
                type: string
              kind:
                type: string
              formula:
                type: string
              triage:
                enum: [statique, MC, dégradé]
              risk:
                type: integer
              cost:
                type: integer
              scenario:
                type: string
              role:
                type: string
              status:
                enum: [pending, accept, refuse, verify-first, covered]
              covered_by:
                type: string
                nullable: true
                description: The surviving question of the human fusion covering this one (spec §12.2); null when not covered.
              convergence_hint:
                type: string
                nullable: true
                description: The earlier generated question this one converges with (spec §14.5); null when original.
              fairness:
                enum: [none, weak, strong]
                description: The fairness hypothesis attached to this clause (spec §14.7, issue #35).
              repairs_run_id:
                type: string
                nullable: true
                description: The run that repairs this liveness clause (spec §14.7, issue #35).
              fairness_status:
                enum: [none, tool-specific, unverifiable-under-fairness]
                description: The explicit degradation when no wired tool supports fairness natively (spec §17.5).
              proofs:
                type: array
                items:
                  type: object
                  required: [run_id, link, status, triage, verdict, tool_version]
                  properties:
                    run_id:
                      type: string
                    link:
                      type: string
                    status:
                      enum: [running, done, error]
                    triage:
                      enum: [statique, MC, dégradé]
                    verdict:
                      type: string
                      nullable: true
                    tool_version:
                      type: string
                    technique:
                      type: string
                      nullable: true
                    cost_tool_seconds:
                      type: number
                      nullable: true
                    witness_id:
                      type: string
                      nullable: true
                      description: The content-hash id of the run's §16 witness, when it carries one (issues #32/#38).
              examination:
                type: string
              cross_status:
                enum: [unverified, verified_by_n, controversial]
              verified_by:
                type: integer
              counter_variant:
                type: object
                nullable: true
                required: [examination, family, formula]
                properties:
                    examination:
                      type: string
                    family:
                      type: string
                    formula:
                      type: string
        budget:
          type: object
          required: [budget_seconds, consumed_seconds, remaining_seconds]
          properties:
            budget_seconds:
              type: number
            consumed_seconds:
              type: number
            remaining_seconds:
              type: number
        proof_dossiers:
          type: array
          description: The clickable proof dossiers of the session's clauses (spec §9 P3, issue #38).
          items:
            $ref: "#/components/schemas/ContractProofDossier"
        journal:
          type: array
          items:
            type: object
    ContractProof:
      type: object
      required: [run_id, link, status, triage, verdict, tool_version, technique, cost_tool_seconds, witness_id]
      properties:
        run_id:
          type: string
        link:
          type: string
        status:
          enum: [running, done, error]
        triage:
          enum: [statique, MC, dégradé]
        verdict:
          type: string
          nullable: true
        tool_version:
          type: string
        technique:
          type: string
          nullable: true
        cost_tool_seconds:
          type: number
          nullable: true
        witness_id:
          type: string
          nullable: true
    ContractProofDossier:
      type: object
      required: [question_id, formula, status, cross_status, verified_by, proofs, camps]
      properties:
        question_id:
          type: string
        formula:
          type: string
        status:
          enum: [pending, accept, refuse, verify-first, covered]
        cross_status:
          enum: [unverified, verified_by_n, controversial]
        verified_by:
          type: integer
        proofs:
          type: array
          items:
            $ref: "#/components/schemas/ContractProof"
        camps:
          type: array
          items:
            type: string
          description: On controversy, the camps tool_version → verdict, exported as-is (spec §17.4).
    ArbitrationDecision:
      type: object
      required: [entry_id, accepted, chosen_role]
      properties:
        entry_id:
          type: string
        accepted:
          type: boolean
        chosen_role:
          type: string
          minLength: 1
    CoverageGroup:
      type: object
      required: [group_id, role, elements, covered_by]
      properties:
        group_id:
          type: string
        role:
          type: string
        elements:
          type: string
        covered_by:
          type: array
          items:
            type: string
    ProfileState:
      type: object
      required: [proposed, arbitrations, groups]
      properties:
        proposed:
          type: object
          description: The LLM-proposed semantic profile.
        arbitrations:
          type: array
          items:
            $ref: "#/components/schemas/ArbitrationDecision"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CoverageGroup"
    CoverageReport:
      type: object
      required: [groups, uncovered_groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/CoverageGroup"
        uncovered_groups:
          type: array
          items:
            $ref: "#/components/schemas/CoverageGroup"
    StateGraphReport:
      type: object
      required: [model_id, formalism, truncated, place_names, initial, states, edges, deadlocks, arc_count, max_states]
      properties:
        model_id:
          type: string
        formalism:
          type: string
        truncated:
          type: boolean
          description: True when the graph was cut at the engine capacity (explicit degradation).
        place_names:
          type: array
          items:
            type: string
        initial:
          type: array
          items:
            type: integer
        states:
          type: array
          items:
            type: array
            items:
              type: integer
        edges:
          type: array
          items:
            type: object
            required: [source, transition, target]
            properties:
              source:
                type: array
                items:
                  type: integer
              transition:
                type: string
              target:
                type: array
                items:
                  type: integer
        deadlocks:
          type: array
          items:
            type: array
            items:
              type: integer
        arc_count:
          type: integer
        max_states:
          type: integer
    AnnotationRequest:
      type: object
      required: [element_id, key, value]
      properties:
        element_id:
          type: string
        key:
          type: string
          minLength: 1
        value: {}
    AnnotationReport:
      type: object
      required: [model_id, element_id, content_hash, annotations]
      properties:
        model_id:
          type: string
        element_id:
          type: string
        content_hash:
          type: string
          description: Unchanged — annotations live outside the content hash (spec §13).
        annotations:
          type: object
    NetOverlay:
      type: object
      required: [model_id, elements, groups, greyed]
      properties:
        model_id:
          type: string
        elements:
          type: array
          items:
            type: object
            required: [id, kind, name, covered, groups]
            properties:
              id:
                type: string
              kind:
                type: string
                enum: [place, transition, arc]
              name:
                type: string
                nullable: true
              covered:
                type: boolean
              groups:
                type: array
                items:
                  type: string
        groups:
          type: array
          items:
            type: object
            required: [group_id, role, covered, elements]
            properties:
              group_id:
                type: string
              role:
                type: string
              covered:
                type: boolean
              elements:
                type: array
                items:
                  type: string
                description: The card's element spec resolved to element ids of the net.
        greyed:
          type: array
          items:
            type: string
          description: The uncovered element ids, rendered greyed by the front.
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        extensions:
          type: object
          additionalProperties: true
    CanonicalModel:
      type: object
      description: The petri+json v1.0 document (spec §13); see src/petrichor/petri_canonical.py.
      required: [id, formalism, content_hash, places, transitions, arcs]
      properties:
        id:
          type: string
        formalism:
          type: string
          enum: [pt, symmetric]
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        parent:
          type: string
          nullable: true
        children:
          type: array
          items:
            type: string
        derivations:
          type: array
          items: {}
        certificates:
          type: array
          items: {}
        places:
          type: array
          items:
            type: object
        transitions:
          type: array
          items:
            type: object
        arcs:
          type: array
          items:
            type: object
        color_domain:
          nullable: true
        metadata:
          type: object
    CheckRequest:
      type: object
      description: The body of POST /checks/{family} (spec §12.1).
      required: [model_id, kind, formula]
      additionalProperties: false
      properties:
        model_id:
          type: string
        kind:
          type: string
          description: The pattern within the family, e.g. safety.invariant or deadlock.
        formula:
          type: string
          minLength: 1
        parameters:
          type: object
          default: {}
        session_id:
          type: string
          nullable: true
          description: The session this run is charged to (spec §12.4, issue #33); admitted against that session's own budget cap and attached to it. Absent: global bucket.
        fairness:
          enum: [none, weak, strong]
          default: none
          description: The fairness parameter of the run (spec §12.3, §14.7, issue #35); each parameter set is a distinct run, billed as such. Runs with a non-none fairness are labeled semantics tool-specific when no wired tool supports it natively.
    Run:
      type: object
      description: >-
        One asynchronous run (spec §5, §6), archived in full (spec §12.5):
        command, tool version, timeout, input hash and measured cost.
        Runs are never deleted - no API or code path removes one.
        output is the normalized engine output served verbatim.
      required: [run_id, status, family, kind, formula, model_id, input_hash, timeout_seconds, tool_version, command, measured_seconds, output, error, engine_qualified, triage, non_vacuity, session_id, fairness, semantics]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [running, done, error]
        family:
          type: string
          enum: [reachability, safety, liveness, recovery, deadlock, structural]
        kind:
          type: string
        formula:
          type: string
        model_id:
          type: string
        input_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Idempotence key - hash of (model, question).
        timeout_seconds:
          type: integer
          minimum: 1
          description: The timeout the run was accepted with (spec §12.5).
        tool_version:
          type: string
          description: The pinned version of the tool that executed the run (spec §12.5).
        command:
          type: array
          items:
            type: string
          nullable: true
          description: The tool command, archived when the run reaches a terminal state; null while running.
        measured_seconds:
          type: number
          nullable: true
          description: >-
            The measured wall-clock tool time of the run (spec §12.4) -
            measured, never estimated; null while running.
        output:
          nullable: true
          description: The normalized engine output when done, null otherwise.
        error:
          nullable: true
          $ref: "#/components/schemas/RunError"
        engine_qualified:
          type: boolean
          nullable: true
          description: >-
            Whether the engine that produced the output is qualified for the
            family (spec §17.5, issue #22); null while running, on error
            runs, or when no qualification lookup is wired. An unqualified
            adapter is never alone on a clause.
        triage:
          $ref: "#/components/schemas/QuestionTriage"
        non_vacuity:
          nullable: true
          $ref: "#/components/schemas/NonVacuityGuard"
        session_id:
          type: string
          nullable: true
          description: The session this run is charged to (spec §12.4, issue #33).
        fairness:
          enum: [none, weak, strong]
          description: The fairness parameter of the run (spec §14.7, issue #35).
        semantics:
          type: string
          nullable: true
          description: tool-specific when the run carries a fairness parameter no wired tool supports natively (spec §17.5); such runs are never inter-tool comparable.
    QuestionTriage:
      type: object
      description: >-
        The static/MC triage of the question with its justification
        (spec §14.2, issue #14). A degraded question displays it here -
        never a silent degradation.
      required: [kind, justification]
      properties:
        kind:
          type: string
          enum: [statique, MC, dégradé]
        justification:
          type: string
          minLength: 1
    NonVacuityGuard:
      type: object
      description: >-
        The non-vacuity chip of the question (spec §14.4, issue #14):
        for EF φ the initial marking must not already satisfy φ, for
        AG ψ it must not violate ψ. A vacuous guard means the property
        says nothing about this model - no verdict is rendered on it.
      required: [guard, status, detail]
      properties:
        guard:
          type: string
          enum: [ef_phi, ag_psi]
          nullable: true
        status:
          type: string
          enum: [ok, vacuous, not_applicable]
        detail:
          type: string
          minLength: 1
    RunError:
      type: object
      description: The explicit failure of a run - never a default verdict.
      required: [kind, detail]
      properties:
        kind:
          type: string
          enum: [engine_error, timeout]
        detail:
          type: string
  responses:
    Unauthorized:
      description: >-
        Web v1 (issue #206): every non-public route requires a session cookie
        or a PAT. Reason `session_required` when no credentials were provided,
        `invalid_bearer_token` when an Authorization header was present but
        rejected. Public read-only routes (GET /catalog/models,
        GET /models/{model_id}) never answer 401.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body media type is not supported by the endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The HTTP method is not supported on this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidPnml:
      description: The PNML document is malformed or uses an unsupported dialect.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    BadRequest:
      description: The request is malformed (e.g. invalid Content-Length).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request body fails schema validation.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: The server has no engine/explorer wired for this resource (e.g. runner not configured).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
