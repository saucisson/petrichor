# OpenAPI contract of the Petrichor HTTP API (ADR-0016) - kept with the code.
# Versioning is explicit in the URL prefix (/v1). Errors are RFC 7807
# problem+json everywhere. Authentication is the X-API-Key header, checked
# before any body is parsed.
openapi: 3.1.0
info:
  title: Petrichor API
  version: 1.0.0
  description: >-
    Gérer service: PNML import into the canonical petri+json v1.0 form and
    model read (spec §4.1, §5, §13), plus asynchronous checks: POST
    /checks/{family} answers 202 + Location and is idempotent by hash of
    (model, question); GET /runs/{run_id} polls running | done | error
    (spec §5, §12.1). Symmetric nets are stored non-unfolded.
servers:
  - url: /v1
security:
  - apiKey: []
paths:
  /models:
    post:
      summary: Import a PNML document into the canonical form
      description: >-
        201 when the content hash is new, 200 when the same net was already
        imported (idempotent by content hash, spec §13). Invalid or
        unsupported PNML is rejected with 422 - never silently unfolded.
      requestBody:
        required: true
        content:
          application/pnml+xml:
            schema:
              type: string
              format: xml
      responses:
        "201":
          description: Model created; Location header points at the resource.
          headers:
            Location:
              schema:
                type: string
              description: /v1/models/{model_id}
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "200":
          description: The content hash was already known; the existing model is returned.
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidPnml"
  /models/{model_id}:
    get:
      summary: Read a model in its canonical form
      parameters:
        - name: model_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The canonical petri+json document, content hash included.
          content:
            application/petri+json; version=1.0:
              schema:
                $ref: "#/components/schemas/CanonicalModel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "406":
          description: >-
            The Accept header admits no supported representation. PNML
            re-export is not supported yet.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /checks/{family}:
    post:
      summary: Accept a check question asynchronously (one endpoint per family)
      description: >-
        Answers 202 Accepted with Location: /v1/runs/{run_id}; the run is
        executed in the background and polled on GET /v1/runs/{run_id}
        (spec §5). Idempotent: the same (model, question) hash returns the
        existing run without re-executing it. The kind pattern must belong
        to the family of the endpoint - a pattern outside the family is
        422 and is never reinterpreted (garde anti-polymorphisme, spec
        §12.1). Engine errors and timeouts surface as the explicit error
        state of the run, never as a default verdict. Every new run passes
        the session budget cap (spec §12.4): when the remaining budget
        cannot cover the run, the request is refused with 429 and the
        remaining budget in the problem extensions - no carry-over.
      parameters:
        - name: family
          in: path
          required: true
          schema:
            type: string
            enum: [reachability, safety, liveness, recovery, deadlock]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckRequest"
      responses:
        "202":
          description: Check accepted; Location header points at the run resource.
          headers:
            Location:
              schema:
                type: string
              description: /v1/runs/{run_id}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          description: The Content-Length header is not an integer.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Unknown check family or unknown model.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: Malformed body, or kind pattern outside the family (never reinterpreted).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            Session budget cap exceeded (spec §12.4): the remaining budget
            cannot cover one run. The problem extensions carry
            remaining_budget_seconds, session_budget_seconds,
            consumed_seconds, reserved_seconds and timeout_seconds.
            No carry-over.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          description: No check runner wired into this server yet (real engines: P09+).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /runs/{run_id}:
    get:
      summary: Poll one asynchronous run
      description: >-
        The run states are running, done (with the normalized engine output
        served verbatim) and error (explicit kind: engine_error or timeout -
        never a default verdict).
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The current state of the run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        extensions:
          type: object
          additionalProperties: true
    CanonicalModel:
      type: object
      description: The petri+json v1.0 document (spec §13); see src/petrichor/petri_canonical.py.
      required: [id, formalism, content_hash, places, transitions, arcs]
      properties:
        id:
          type: string
        formalism:
          type: string
          enum: [pt, symmetric]
        content_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        parent:
          type: string
          nullable: true
        children:
          type: array
          items:
            type: string
        derivations:
          type: array
          items: {}
        certificates:
          type: array
          items: {}
        places:
          type: array
          items:
            type: object
        transitions:
          type: array
          items:
            type: object
        arcs:
          type: array
          items:
            type: object
        color_domain:
          nullable: true
        metadata:
          type: object
    CheckRequest:
      type: object
      description: The body of POST /checks/{family} (spec §12.1).
      required: [model_id, kind, formula]
      additionalProperties: false
      properties:
        model_id:
          type: string
        kind:
          type: string
          description: The pattern within the family, e.g. safety.invariant or deadlock.
        formula:
          type: string
          minLength: 1
        parameters:
          type: object
          default: {}
    Run:
      type: object
      description: >-
        One asynchronous run (spec §5, §6), archived in full (spec §12.5):
        command, tool version, timeout, input hash and measured cost.
        Runs are never deleted - no API or code path removes one.
        output is the normalized engine output served verbatim.
      required: [run_id, status, family, kind, formula, model_id, input_hash, timeout_seconds, tool_version, command, measured_seconds, output, error]
      properties:
        run_id:
          type: string
        status:
          type: string
          enum: [running, done, error]
        family:
          type: string
          enum: [reachability, safety, liveness, recovery, deadlock]
        kind:
          type: string
        formula:
          type: string
        model_id:
          type: string
        input_hash:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
          description: Idempotence key - hash of (model, question).
        timeout_seconds:
          type: integer
          minimum: 1
          description: The timeout the run was accepted with (spec §12.5).
        tool_version:
          type: string
          description: The pinned version of the tool that executed the run (spec §12.5).
        command:
          type: array
          items:
            type: string
          nullable: true
          description: The tool command, archived when the run reaches a terminal state; null while running.
        measured_seconds:
          type: number
          nullable: true
          description: >-
            The measured wall-clock tool time of the run (spec §12.4) -
            measured, never estimated; null while running.
        output:
          nullable: true
          description: The normalized engine output when done, null otherwise.
        error:
          nullable: true
          $ref: "#/components/schemas/RunError"
    RunError:
      type: object
      description: The explicit failure of a run - never a default verdict.
      required: [kind, detail]
      properties:
        kind:
          type: string
          enum: [engine_error, timeout]
        detail:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid X-API-Key.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Unknown resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: The request body media type is not supported by the endpoint.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: The HTTP method is not supported on this resource.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidPnml:
      description: The PNML document is malformed or uses an unsupported dialect.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
