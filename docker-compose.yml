# Petrichor services (spec §19.4, ADR-0102): the API is the source-of-truth
# server (serves /ui/ + /v1/), the engines are one compose service each -
# images built locally (GPL engines are not redistributed), base image pinned
# by digest, healthcheck, non-privileged read-only container, and no network
# beyond the loopback-published port.
#
# The engine timeout is configurable: ENGINE_TIMEOUT (seconds, default 30).
# The API key is required: PETRICHOR_API_KEY must be set in the environment.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: petrichor-api:2.0.0
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    environment:
      PETRICHOR_API_KEY: ${PETRICHOR_API_KEY:?PETRICHOR_API_KEY is required}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - petrichor-data:/app/.petrichor
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ui/', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: "no"
  dummy:
    build:
      context: .
      dockerfile: Dockerfile.dummy
    image: petrichor-engine-dummy:0.1.0
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${DUMMY_HOST_PORT:-18080}:8080"
    environment:
      ENGINE_TIMEOUT: ${ENGINE_TIMEOUT:-30}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: "no"
  verifypn:
    build:
      context: .
      dockerfile: Dockerfile.verifypn
    image: petrichor-engine-verifypn:4.4.2
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${VERIFYPN_HOST_PORT:-18081}:8080"
    environment:
      ENGINE_TIMEOUT: ${ENGINE_TIMEOUT:-30}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: "no"
  its-tools:
    build:
      context: .
      dockerfile: Dockerfile.its-tools
    image: petrichor-engine-its-tools:10052022
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "127.0.0.1:${ITS_TOOLS_HOST_PORT:-18082}:8080"
    environment:
      ENGINE_TIMEOUT: ${ENGINE_TIMEOUT:-30}
      PYTHONDONTWRITEBYTECODE: "1"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 2s
    restart: "no"

volumes:
  petrichor-data:
